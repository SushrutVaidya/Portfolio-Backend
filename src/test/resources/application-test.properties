# Test-only overrides. Applied via @ActiveProfiles("test") on tests that
# actually boot Spring. Unit tests below use pure Mockito so they don't
# touch this file at all — no Postgres, no Redis, no Spring context.
#
# Integration tests that need real infra spin it up via testcontainers
# (see /it/*IT.java) and override datasource props via
# @DynamicPropertySource.

# HMAC — deterministic value for repeatable token assertions. Only used
# when a test actually starts AuthTokenService via Spring context.
auth.hmac-secret=test-secret-for-hmac-only

# Uploads dir under /tmp so tests don't pollute repo.
portfolio.uploads.dir=${java.io.tmpdir}/dq-uploads

# Actuator + logging kept quiet during tests.
logging.level.root=WARN
logging.level.com.sushrut=INFO
