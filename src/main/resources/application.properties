spring.application.name=Portfolio-Backend
server.port = 8081
portfolio.location = Hyderabad
portfolio.game = Counter Strike 2
portfolio.songName=a banger
portfolio.bookName = Fundamentals of Microcontrollers and MicroProcessors
steam.api.key=${STEAM_API_KEY:}
steam.steam-id=${STEAM_ID:}

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Suppress harmless macOS SocketException spam from Tomcat acceptor (SO_LINGER on closed socket)
logging.level.org.apache.tomcat.util.net.Acceptor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR

# Redis Configuration (Upstash)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# POSTGRES_CONFIG
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/portfolio
spring.datasource.username=${DB_USERNAME:dominic}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Photo Upload Configuration
portfolio.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error response — hide stack traces and internals from API responses
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-exception=false

