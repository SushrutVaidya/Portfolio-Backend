spring.application.name=Portfolio-Backend
server.port = 8081
portfolio.location = Hyderabad
portfolio.game = Counter Strike 2
portfolio.songName=a banger
portfolio.bookName = Fundamentals of Microcontrollers and MicroProcessors
steam.api.key=${STEAM_API_KEY:}
steam.steam-id=${STEAM_ID:}

# Logging — see logback-spring.xml for structured JSON pattern.
# Default profile → JSON output (aggregator-friendly, one line per event).
# Local IDE runs use human pattern via:  --spring.profiles.active=local
logging.level.org.springframework.web=INFO
# Suppress harmless macOS SocketException spam from Tomcat acceptor (SO_LINGER on closed socket)
logging.level.org.apache.tomcat.util.net.Acceptor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR

# Redis Configuration (Upstash)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Actuator — /health exposed publicly (nginx-proxy uses it as a probe) but
# details limited to `when-authorized` so unauth callers get only
# `{"status":"UP"}`. Any deeper detail (DB pool, disk, Redis state) would
# be a recon aid. Change to `always` only if you add HTTP auth in front.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false

# POSTGRES_CONFIG
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/portfolio
spring.datasource.username=${DB_USERNAME:dominic}
spring.datasource.password=${DB_PASSWORD}
# Kept as `update` during Flyway rollout so an entity change without a
# matching V{N}__ file is still tolerated locally. Once V1 has run cleanly
# on OCI, flip this to `validate` — Hibernate will then refuse to start if
# the schema drifts from JPA annotations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP — sized for OCI Ampere A1.Flex (4 OCPU, 24GB) but tight enough
# that we don't exhaust Postgres's default 100 connections. Formula:
#   max-connections = ((core_count * 2) + effective_spindle_count)
# 4 cores * 2 = 8; add slack for GC / hot pool = 10. minimum-idle=2
# keeps handshake latency low without holding conns hostage.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=DevQuestHikari

# Flyway — versioned migrations from classpath:db/migration.
# baseline-on-migrate=true lets Flyway adopt the existing EC2 prod DB
# without complaining that V1 pre-exists — it stamps schema_version and
# moves on. Fresh OCI DB just runs V1 top-to-bottom.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Photo Upload Configuration
portfolio.uploads.dir=${UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Error response — hide stack traces and internals from API responses
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-exception=false

# Auth (weak HMAC token — see AuthTokenService).
# Prod MUST override with a strong random value: openssl rand -base64 48
# Default here is only for local IDE runs; rotating this invalidates all tokens.
auth.hmac-secret=${AUTH_HMAC_SECRET:local-dev-secret-do-not-use-in-prod-please}

