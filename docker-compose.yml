# DevQuest production stack — OCI Always Free (ARM Ampere A1.Flex)
#
# Assumes layout on the OCI VM:
#   /home/ubuntu/
#     ├── Portfolio-Backend/        ← git clone, this file lives here
#     │   ├── docker-compose.yml    (this file)
#     │   ├── .env                  (copy from .env.template, fill values)
#     │   ├── Dockerfile            (backend)
#     │   └── src/main/resources/static/   (extracted from tar)
#     ├── Portfolio-Frontend/       ← git clone
#     │   ├── Dockerfile            (frontend)
#     │   └── nginx-reverse-proxy.conf
#     └── certbot/                  (created on first run by certbot)
#
# Run from /home/ubuntu/Portfolio-Backend with:
#   docker compose up -d --build

services:
  # ─────────────────────────────────────────────────────
  # Postgres — primary data store
  # ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devquest]

  # ─────────────────────────────────────────────────────
  # Spring Boot backend (port 8081 internal only)
  # ─────────────────────────────────────────────────────
  portfolio-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Spring uses these — explicit to avoid surprises
      DB_HOST:     postgres
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [devquest]

  # ─────────────────────────────────────────────────────
  # Static frontend (nginx, port 8080 internal only)
  # ─────────────────────────────────────────────────────
  portfolio-frontend:
    build:
      context: ../Portfolio-Frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    networks: [devquest]

  # ─────────────────────────────────────────────────────
  # Public-facing reverse proxy — TLS + routing
  # ─────────────────────────────────────────────────────
  nginx-proxy:
    image: nginx:alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Portfolio-Frontend/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - portfolio-backend
      - portfolio-frontend
    networks: [devquest]

  # ─────────────────────────────────────────────────────
  # Let's Encrypt cert renewal sidecar
  # Renews twice daily; nginx reloads automatically via shared volume
  # ─────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: portfolio-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >-
      sh -c "trap exit TERM;
             while :;
               do certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  pgdata:        # Postgres data — survives container removal
  uploads_data:  # User-uploaded photos — survives container removal
  letsencrypt:   # SSL certs from Let's Encrypt
  certbot_www:   # ACME challenge files

networks:
  devquest:
    driver: bridge
